# Public read-only demo. Enable an operator key and durable disk before real imports.
services:
  - type: web
    name: sih26170-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SIH26170_ENABLE_DEMO_WRITES
        value: "0"
